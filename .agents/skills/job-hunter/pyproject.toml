[project]
name = "job-hunter"
version = "0.1.0"
description = "Scraper multi-sources d'offres (stage, alternance, CDD, CDI), filtre ecoles/CFA vs vrais jobs, et generateur de drafts .md/.eml"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.2",
    "lxml>=5.3.0",
    "playwright>=1.48.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
job-hunter = "scripts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
