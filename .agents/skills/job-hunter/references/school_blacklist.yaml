# Motifs regex appliqués sur (titre + description) après normalisation sans accents (minuscules).
# Conçus pour cibler les offres servant à recruter des étudiants, sans bloquer les vraies entreprises
# qui mentionnent un niveau d'études requis ("Vous préparez un Master / diplôme d'école d'ingénieurs").
blacklisted_phrases:
  - "rejoignez notre (?:ecole|campus|cfa|centre de formation|organisme)"
  - "au sein de notre (?:ecole|campus|cfa|centre de formation)"
  - "notre (?:ecole|cfa|campus) (?:recherche|recrute|vous accompagne|forme|propose)"
  - "nous vous aidons a trouver votre entreprise"
  - "aide a la recherche d'entreprise"
  - "placement en entreprise"
  - "frais de scolarite"
  - "sans frais de scolarite"
  - "formation (?:100% )?financee par l'opco"
  - "formation prise en charge par l'opco"
  - "aucun frais (?:de formation|a prevoir) pour l'alternant"
  - "admission sur dossier"
  - "inscrivez-vous a notre (?:formation|bachelor|mastere)"
  - "titre rncp.{0,40}(?:prepare|propose) par notre"
  - "dans le cadre de notre (?:bachelor|mastere|formation|programme)"
  - "rentree (?:de )?(?:septembre|octobre|janvier).{0,30}(?:places disponibles|inscriptions)"
  - "nous recrutons pour l'une de nos entreprises partenaires.{0,80}(?:rncp|bachelor|mastere|formation|ecole|cfa)"
  - "ecole partenaire.{0,60}(?:rncp|bachelor|mastere|alternance)"
  - "notre organisme de formation"
